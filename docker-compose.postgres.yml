services:
  app:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_DSN: host=postgres user=${POSTGRES_USER:-lab_asset} password=${POSTGRES_PASSWORD:-lab_asset_pass} dbname=${POSTGRES_DB:-lab_asset} port=5432 sslmode=disable TimeZone=Asia/Shanghai

  postgres:
    image: postgres:17-alpine
    container_name: lab-asset-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab_asset}
      POSTGRES_USER: ${POSTGRES_USER:-lab_asset}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab_asset_pass}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab_asset} -d ${POSTGRES_DB:-lab_asset}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:

name: lab-asset-manager

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/ur-xiaoyang/asset-management-system:latest}
    container_name: lab-asset-manager
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      GIN_MODE: release
      PORT: "8080"
      DB_TYPE: ${DB_TYPE:-sqlite}
      DB_PATH: /app/data/lab_asset.db
      DB_DSN: ${DB_DSN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_NAME: ${ADMIN_NAME:-系统管理员}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_SECURE: ${SMTP_SECURE:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
